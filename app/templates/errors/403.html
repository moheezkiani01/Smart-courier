{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-danger fw-bold">403</h1>
        <h3 class="fw-semibold">Access Forbidden</h3>
        <p class="text-muted">You do not possess the required operational role, branch scope, or ownership to view this resource.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary mt-3"><i class="bi bi-arrow-left me-1"></i> Return to Safety</a>
    </div>
</div>
{% endblock %}

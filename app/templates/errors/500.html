{% extends "base.html" %}
{% block title %}500 Internal Error{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-danger fw-bold">500</h1>
        <h3 class="fw-semibold">System Server Error</h3>

    </div>
</div>
{% endblock %}

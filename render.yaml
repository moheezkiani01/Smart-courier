services:
  - type: web
    name: smart-courier
    runtime: python
    plan: free
    repo: https://github.com/moheezkiani01/Smart-courier
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash ./start.sh
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
